apiVersion: v1
kind: Service
metadata:
  name: {{ include "quizzz.fullname" . }}
  labels:
    {{- include "quizzz.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "quizzz.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
