replicaCount: 1

image:
  repository: quizzz
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    # WebSocket support annotations for nginx ingress controller
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.org/websocket-services: "quizzz"
  hosts:
    - host: quizzz.tmpclaw.io
      paths:
        - path: /
          pathType: Prefix
    - host: shell.quizzz.tmpclaw.io
      paths:
        - path: /
          pathType: Prefix

# Autoscaling is disabled by default because quizzz holds all game state
# in-memory in a single process. Scaling beyond 1 replica would break active
# sessions unless sticky sessions or a shared state layer (e.g. Redis) is added.
# Only enable autoscaling after addressing the in-memory state limitation.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

probes:
  liveness:
    enabled: true
    path: /healthz
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    enabled: true
    path: /healthz
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
