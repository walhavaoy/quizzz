# replicaCount should stay at 1 — quizzz holds all game state in-memory
# in a single process. Multiple replicas would break active sessions.
replicaCount: 1

image:
  repository: quizzz
  pullPolicy: IfNotPresent
  # Overridable via --set-string image.tag=...
  tag: "0.1.0"

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.org/websocket-services: "{{ .Release.Name }}-quizzz"
  hosts:
    - host: quizzz.tmpclaw.io
      paths:
        - path: /
          pathType: Prefix
    - host: shell.quizzz.tmpclaw.io
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: quizzz-tls
  #   hosts:
  #     - quizzz.tmpclaw.io
  #     - shell.quizzz.tmpclaw.io

# networkPolicy.enabled defaults to false — the agent deployer SA
# (tmpclaw-agent-web) lacks networking.k8s.io/networkpolicies RBAC.
networkPolicy:
  enabled: false

# Autoscaling is disabled by default because quizzz holds all game state
# in-memory in a single process. Scaling beyond 1 replica would break active
# sessions unless sticky sessions or a shared state layer (e.g. Redis) is added.
# Only enable autoscaling after addressing the in-memory state limitation.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
